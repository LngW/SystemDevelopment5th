name: Linter Checks

on: [push, pull_request]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
      
      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.4.4
      
      - name: Run ruff check
        run: |
          ruff check .
      
      - name: Run ruff format check
        run: |
          ruff format --check .